<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${item.id} ? 'Editar ' + ${#strings.capitalize(param.tipo)} : 'Nuevo ' + ${#strings.capitalize(param.tipo)}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${item.id} ? 'Editar ' + ${#strings.capitalize(param.tipo)} : 'Nuevo ' + ${#strings.capitalize(param.tipo)}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/favoritos/guardar}" method="post" th:object="${item}">
                        <input type="hidden" th:field="*{id}">

                        <!-- Campos comunes -->
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Género</label>
                                <input type="text" th:field="*{genero}" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Año</label>
                                <input type="number" th:field="*{anio}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Imagen (URL)</label>
                            <input type="url" th:field="*{imagen}" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                        </div>

                        <!-- Campo específico dinámico -->
                        <div th:switch="${param.tipo}">
                            <div th:case="'album'" class="mb-3">
                                <label class="form-label">Artista</label>
                                <input type="text" th:field="*{artista}" class="form-control">
                            </div>
                            <div th:case="'juego'" class="mb-3">
                                <label class="form-label">Desarrollador</label>
                                <input type="text" th:field="*{desarrollador}" class="form-control">
                            </div>
                            <div th:case="'pelicula'" class="mb-3">
                                <label class="form-label">Director</label>
                                <input type="text" th:field="*{director}" class="form-control">
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/favoritos}" class="btn btn-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{::footer}"></div>
<div th:replace="~{::jsincludes}"></div>
</body>
</html>
