<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis Favoritos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            height: 180px;
            object-fit: cover;
        }
        .badge-genre {
            font-size: 0.9em;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4 text-center">Mis Favoritos</h1>

    <div class="d-flex justify-content-between mb-4">
        <a th:href="@{/favoritos/formulario}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Agregar Nuevo
        </a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div th:each="item : ${favoritos}" class="col">
            <div class="card h-100 shadow-sm">
                <img th:src="${item.imagen ?: 'https://via.placeholder.com/300x200?text=Sin+imagen'}"
                     class="card-img-top" alt="Imagen">
                <div class="card-body">
                    <h5 class="card-title" th:text="${item.nombre}"></h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge bg-primary badge-genre" th:text="${item.genero}"></span>
                        <small class="text-muted" th:text="${item.anio}"></small>
                    </div>

                    <p class="card-text">
                            <span th:if="${item instanceof T(mx.unam.aragon.ico.te.favoritosmvc.modelos.AlbumFavorito)}">
                                <strong>Artista:</strong> <span th:text="${item.artista}"></span>
                            </span>
                        <span th:if="${item instanceof T(mx.unam.aragon.ico.te.favoritosmvc.modelos.JuegoFavorito)}">
                                <strong>Desarrollador:</strong> <span th:text="${item.desarrollador}"></span>
                            </span>
                        <span th:if="${item instanceof T(mx.unam.aragon.ico.te.favoritosmvc.modelos.PeliculaFavorita)}">
                                <strong>Director:</strong> <span th:text="${item.director}"></span>
                            </span>
                    </p>
                </div>
                <div class="card-footer bg-white">
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/favoritos/formulario(id=${item.id}, tipo=${item.getClass().getSimpleName().toLowerCase()})}"
                           class="btn btn-sm btn-outline-warning">
                            Editar
                        </a>
                        <a th:href="@{/favoritos/eliminar(id=${item.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Eliminar este item?')">
                            Eliminar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-4">
    <div class="container">
        <p class="mb-0">© 2023 Mis Favoritos - Todos los derechos reservados</p>
    </div>
</footer>

<div th:fragment="jsincludes">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</div>
</body>
</html>
