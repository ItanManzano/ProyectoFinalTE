<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="headForm">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favly: Nuevo</title>
    <link  rel="icon" type="image/x-icon" th:href="@{/images/icons/FavlyIcon.ico}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/formularioStyle.css}">
</head>
<body>
<!-- Formulario para agregar favorito -->
<div th:fragment="form-add">
    <header class="header">
        <span class="heart-icon">❤️</span>
        <h1>Agregar Favorito</h1>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <span class="heart-icon">➕</span>
                <h2>Nuevo Favorito</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/favoritos/guardar}" th:method="post" th:object="${favorito}">
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{fechaCreacion}" />
                    <div class="form-group">
                        <label class="form-label" for="nombre">Nombre</label>
                        <div class="input-icon">
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required="" placeholder="Ej: Artista, Damon Days, Expedition 33" autocomplete="off">
                        </div>
                        <span class="form-helper">Escribe un nombre que te ayude a identificar este favorito</span>
                    </div>

                    <div class="form-group" th:fragment="categoria">
                        <label class="form-label" for="categoria">Categoría</label>
                        <select class="form-control form-select" id="categoria" th:field="*{categoria}" required="">
                            <option value="">-- Selecciona una categoría --</option>
                            <option value="ALBUM">Álbum</option>
                            <option value="JUEGO">Juego</option>
                            <option value="CANCION">Canción</option>
                            <option value="DODOGAMA">Dodogama</option>
                            <option value="DEPORTE">Deporte</option>
                            <option value="EQUIPO">Equipo</option>
                            <option value="PAÍS">País</option>
                            <option value="APP">APP</option>
                            <option value="MARCA">Marca</option>
                            <option value="ARTISTA">Artista</option>
                            <option value="CELEBRIDAD">Celebridad</option>
                            <option value="COLOR">Color</option>
                            <option value="ESTACION">Estacion del Año</option>v

                        </select>
                        <div class="category-pills">
                            <span class="category-pill" data-value="ALBUM">Álbum</span>
                            <span class="category-pill" data-value="JUEGO">Juego</span>
                            <span class="category-pill" data-value="LIBRO">Libro</span>
                            <span class="category-pill" data-value="CANCION">Canción</span>
                            <span class="category-pill" data-value="DODOGAMA">Dodogama</span>
                            <span class="category-pill" data-value="DEPORTE">Deporte</span>
                            <span class="category-pill" data-value="EQUIPO">Equipo</span>
                            <span class="category-pill" data-value="PAIS">País</span>
                            <span class="category-pill" data-value="APP">App</span>
                            <span class="category-pill" data-value="MARCA">Marca</span>
                            <span class="category-pill" data-value="ARTISTA">Artista</span>
                            <span class="category-pill" data-value="CELEBRIDAD">Celebridad</span>
                            <span class="category-pill" data-value="COLOR">Color</span>
                            <span class="category-pill" data-value="ESTACION">Estación del año</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="url">URL</label>
                        <div class="input-icon">
                            <input type="url" class="form-control" id="url" th:field="*{url}" placeholder="https://" autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <textarea class="form-control" id="descripcion" th:field="*{descripcion}" placeholder="Agrega una descripción de este favorito..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="tags" class="form-label">Tags</label>
                        <input
                                type="text"
                                id="tags"
                                th:field="*{tags}"
                                class="form-control"
                                placeholder="Ej: video,educativo,entretenimiento">
                        <div class="form-text">
                            Escribe etiquetas separadas por comas (sin espacios obligatorios).
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">Guardar Favorito</button>
                        <a th:href="@{/favoritos}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/InteraccionFormulario.js}"></script>
</body>
</html>
