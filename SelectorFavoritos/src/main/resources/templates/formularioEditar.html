<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="formularioAgregar :: headForm">
    <meta charset="UTF-8">
    <title>Favly: Editar</title>
</head>
<body>

<!-- Formulario para editar favorito -->
<div th:fragment="form-edit">
    <input type="hidden" th:field="*{id}" />
    <header class="header">
        <span class="heart-icon">❤️</span>
        <h1>Editar Favorito</h1>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <span class="heart-icon">✏️</span>
                <h2>Editar Favorito</h2>
            </div>

            <div class="card-body">
                <form th:action="@{/favoritos/actualizar}" th:method="post" th:object="${favorito}">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{fechaCreacion}">

                    <div class="form-group">
                        <label class="form-label" for="nombre">Nombre</label>
                        <div class="input-icon">
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required="" placeholder="Ej: YouTube, Netflix, etc." autocomplete="off">
                        </div>
                        <span class="form-helper">Escribe un nombre que te ayude a identificar este favorito</span>
                    </div>

                    <div class="form-group" th:replace="formularioAgregar :: categoria">
                        <!--
                         <label class="form-label" for="categoria">Categoría</label>
                        <select class="form-control form-select" id="categoria" th:field="*{categoria}" required="">
                            <option value="">-- Selecciona una categoría --</option>
                            <option value="SITIOS_WEB">Sitios Web</option>
                            <option value="PELICULAS">Películas</option>
                            <option value="LIBROS">Libros</option>
                            <option value="MUSICA">Música</option>
                        </select>
                        <div class="category-pills">
                            <span class="category-pill" data-value="SITIOS_WEB">Sitios Web</span>
                            <span class="category-pill" data-value="PELICULAS">Películas</span>
                            <span class="category-pill" data-value="LIBROS">Libros</span>
                            <span class="category-pill" data-value="MUSICA">Música</span>
                        </div>
                        -->
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="url">URL</label>
                        <div class="input-icon">
                            <input type="url" class="form-control" id="url" th:field="*{url}" placeholder="https://" autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <textarea class="form-control" id="descripcion" th:field="*{descripcion}" placeholder="Agrega una descripción de este favorito..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="tags" class="form-label">Tags</label>
                        <input
                                type="text"
                                id="tags"
                                th:field="*{tags}"
                                class="form-control"
                                placeholder="Ej: video,educativo,entretenimiento">
                        <div class="form-text">
                            Escribe etiquetas separadas por comas (sin espacios obligatorios).
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">Actualizar Favorito</button>
                        <a th:href="@{/favoritos}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/InteraccionFormulario.js}"></script>
<div th:replace="inicio :: jsfields">
</div>
</body>
</html>
